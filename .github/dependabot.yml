# Automated dependency updates. Dependabot opens PRs when dependencies have newer versions.
# Minor/patch bumps are grouped into a single weekly PR to cut noise.
#
# MAJOR version bumps are NOT proposed automatically (see `ignore` below). A major release is
# the library's authors saying "we deliberately broke compatibility", and two of them shipped
# breakage here that nothing caught:
#   - eslint 10 crashed the linter outright. Deploys don't gate on lint, so it stayed green
#     and the breakage went unnoticed.
#   - cobe 2 removed an option the homepage globe uses, which broke `next build` itself.
# Majors are now a deliberate act: bump the version by hand, run typecheck + lint + tests, and
# actually look at whatever the library renders before merging.
#
# IMPORTANT - this only stops the routine "a newer version exists" PRs. Dependabot SECURITY
# ALERTS are a separate toggle (GitHub -> Settings -> Code security & analysis) and stay ON.
# If a fix for a real vulnerability exists only in a new major, it won't arrive as an automatic
# PR any more - it has to be taken deliberately. Watch the alerts, not the PR queue, for those.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # No automatic major-version PRs, for any package. See the note at the top of this file.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Listed individually as the record of WHY this policy exists, and so these three stay
      # held even if the blanket rule above is ever relaxed:
      #   typescript 7.x - typescript-eslint has no TS >= 7 support yet (typescript-eslint#10940)
      #   eslint 10.x    - eslint-config-next's eslint-plugin-react calls the removed
      #                    context.getFilename() API and crashes under ESLint 10
      #   cobe 2.x       - dropped the `onRender` option the homepage globe animates with;
      #                    needs an IntegrationGlobe migration (to globe.update() in a rAF
      #                    loop) and a real visual check that the globe still spins
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cobe"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    ignore:
      # Same policy for workflow actions: a major (say actions/checkout v4 -> v5) can break CI
      # the same way, so those are taken deliberately too.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
